# Wave 1 entity_id-tool corpus (find_entities Consumer 3, core-deltas CD1).
#
# The corpus gap evaluation.md Part E has carried open since the first name-injection run:
# every existing case targets a device through an intent tool that takes a spoken `name` and
# resolves it itself, so nothing has ever forced the model to produce an `entity_id`. This
# corpus forces it. Each case's target is an exposed **script** whose parameter is declared
# with an entity selector, which HA serializes to `{"type": "string", "format": "entity_id"}`
# (helpers/llm.py:816) while putting no entity_id anywhere in the prompt.
#
# Two questions, one corpus:
#
#   1. Does Consumer 3 earn its keep? Run the same case with entity-argument resolution on and
#      off. Off is stock HA behavior: the model's invented id reaches hass.services.async_call
#      and the script targets nothing, so the world does not move and the case fails. On, the
#      argument is resolved before execution. The delta is the feature's value, measured rather
#      than argued.
#   2. Do prompt-loaded names help *here*? This is the case the name-injection hypothesis was
#      always about (evaluation.md Part E, row 1): with resolution off, an injected name/id pair
#      is the only way for the model to get a real id without a find_entities round-trip. If
#      names do not pay on this corpus, they do not pay anywhere.
#
# Measurement honesty, three things this corpus is built to avoid faking:
#
#   - **Object ids are not slugified names.** `light.hue_00a3` is named "Reading Lamp". A
#     corpus where `light.reading_lamp` is named "Reading Lamp" would let the model guess the
#     id correctly from the prompt and every arm would pass, measuring nothing. This is also
#     the exact shape the upstream reporter described.
#   - **Scripts move real fixture entities.** Every sequence acts on a backed light or cover,
#     so cases are state-scored: correctness is the world the turn left behind, and a call
#     that "succeeded" against a nonexistent id changes nothing and fails.
#   - **No script names its target.** A script called "Dim The Reading Lamp" would leak the
#     answer into the tool description. Each script is a generic verb over a parameter.
#
# Cases are tagged by how the target is referred to, since that is what varies:
#   - `in_vocabulary`: the utterance uses the entity's registered name ("the reading lamp").
#   - `out_of_vocabulary`: the utterance paraphrases it ("the lamp by the couch"), so even a
#     correct id guess is out of reach and resolution has to do real work.

world:
  areas:
    - bedroom
    - hallway
    - kitchen
    - living_room
    - office

  entities:
    # Every object id below is deliberately un-guessable from the friendly name: a
    # manufacturer id, a suffix, or a different word order. This is the corpus's load-bearing
    # property.
    - entity_id: light.hue_00a3
      name: Reading Lamp
      area: living_room
      state: "off"
    - entity_id: light.hue_00b7
      name: Corner Floor Lamp
      area: living_room
      state: "off"
    - entity_id: light.zw_kitchen_2
      name: Under Cabinet Lighting
      area: kitchen
      state: "off"
    - entity_id: light.bedroom_lamp_v2
      name: Bedside Lamp
      area: bedroom
      state: "off"
    - entity_id: cover.somfy_4412
      name: Office Roller Shade
      area: office
      device_class: shade
      state: open

  scripts:
    # Generic verbs over an entity parameter. The description says what the script does, never
    # which device it does it to, so the model must resolve the target from the utterance.
    - object_id: evening_dim
      name: Evening Dim
      description: >-
        Switch one light off as part of the evening wind-down. Takes the light to act on.
      fields:
        light:
          name: Light
          description: The light to switch off.
          required: true
          selector:
            entity:
              domain: light
      sequence:
        - action: light.turn_off
          target:
            entity_id: "{{ light }}"

    - object_id: privacy_mode
      name: Privacy Mode
      description: >-
        Close one cover for privacy. Takes the cover to close.
      fields:
        cover:
          name: Cover
          description: The cover to close.
          required: true
          selector:
            entity:
              domain: cover
      sequence:
        - action: cover.close_cover
          target:
            entity_id: "{{ cover }}"

    - object_id: wake_up
      name: Wake Up
      description: >-
        Switch one light on to start the day. Takes the light to act on.
      fields:
        light:
          name: Light
          description: The light to switch on.
          required: true
          selector:
            entity:
              domain: light
      sequence:
        - action: light.turn_on
          target:
            entity_id: "{{ light }}"

cases:
  # --- The registered name is spoken: the model has the name but never the id. ---

  - id: named-target-reading-lamp
    utterance: run the evening dim on the reading lamp
    category: script-entity-argument
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    satellite_area: living_room
    requires: [light.hue_00a3]
    # The plainest possible instance: the tool is named, the target is named, and the only
    # missing piece is the id. With resolution off, the model must invent one
    # (`light.reading_lamp`, which does not exist) or look it up.
    setup:
      light.hue_00a3: {state: "on"}
    expect_changes:
      light.hue_00a3: {state: "off"}
    permitted_tools:
      - name: evening_dim
      - name: find_entities
      - name: GetLiveContext

  - id: named-target-cross-room
    utterance: run the evening dim on the bedside lamp
    category: script-entity-argument
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    satellite_area: living_room
    requires: [light.bedroom_lamp_v2]
    # Same shape, target in another room, so the requesting room cannot shortcut it and a
    # room-scoped name injection has to reach across the house to help.
    setup:
      light.bedroom_lamp_v2: {state: "on"}
    expect_changes:
      light.bedroom_lamp_v2: {state: "off"}
    permitted_tools:
      - name: evening_dim
      - name: find_entities
      - name: GetLiveContext

  - id: named-target-cover
    utterance: turn on privacy mode for the office roller shade
    category: script-entity-argument
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    satellite_area: hallway
    requires: [cover.somfy_4412]
    # A second domain, so a pass is not an artifact of lights being the easy case, and the
    # selector's `domain: cover` filter is exercised.
    expect_changes:
      cover.somfy_4412: {state: closed}
    permitted_tools:
      - name: privacy_mode
      - name: find_entities
      - name: GetLiveContext

  # --- The target is paraphrased: no id is guessable, and no exact name is either. ---

  - id: paraphrased-target-couch-lamp
    utterance: run the evening dim on the lamp by the couch
    category: script-entity-argument
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    satellite_area: living_room
    requires: [light.hue_00b7]
    # "the lamp by the couch" is neither the registered name ("Corner Floor Lamp") nor a
    # guessable id. Consumer 3's exact rungs cannot resolve it either: it should come back as
    # candidates and the model should ask or pick, which is the behavior worth measuring.
    # The other living-room light ("Reading Lamp") is the distractor.
    setup:
      light.hue_00b7: {state: "on"}
    expect_changes:
      light.hue_00b7: {state: "off"}
    permitted_tools:
      - name: evening_dim
      - name: find_entities
      - name: GetLiveContext

  - id: paraphrased-target-cabinet-lights
    utterance: run the evening dim on the under cabinet lights
    category: script-entity-argument
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    satellite_area: kitchen
    requires: [light.zw_kitchen_2]
    # One token off the registered name ("lights" vs "Under Cabinet Lighting"): near the
    # accept threshold, so whether it resolves exactly, through find_entities, or comes back
    # as a candidate is the signal.
    setup:
      light.zw_kitchen_2: {state: "on"}
    expect_changes:
      light.zw_kitchen_2: {state: "off"}
    permitted_tools:
      - name: evening_dim
      - name: find_entities
      - name: GetLiveContext

  - id: wake-up-bedside
    utterance: run wake up on the bedside lamp
    category: script-entity-argument
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    satellite_area: bedroom
    requires: [light.bedroom_lamp_v2]
    # A turn-on script, so the corpus is not entirely "switch something off" and a stuck
    # baseline state cannot masquerade as success.
    expect_changes:
      light.bedroom_lamp_v2: {state: "on"}
    permitted_tools:
      - name: wake_up
      - name: find_entities
      - name: GetLiveContext
