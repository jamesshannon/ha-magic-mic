# Wave 0 golden set.
#
# Seed corpus for the Tier-B eval harness (docs/evaluation.md Part E). See
# ../README.md for the field spec and how routing_truth was grounded.
#
# `local` cases were verified against the installed home_assistant_intents sentence
# templates (en.json). `llm` cases have no matching template but resolve today with
# existing tools or model knowledge. `resolves_at_wave0: false` cases are VISION
# features not built yet; they exist so the baseline "don't understand" bucket is
# real, and each later wave can watch its cases move.

# The fixture home the cases run against. The runner exposes exactly these entities
# before running, so slot-bearing utterances have something to resolve to.
world:
  areas:
    - kitchen
    - living_room
    - bedroom
    - garage
    - office
  entities:
    - entity_id: light.kitchen
      name: Kitchen Light
      area: kitchen
      state: "on"
    - entity_id: light.living_room
      name: Living Room Lamp
      area: living_room
      state: "on"
    - entity_id: light.bedroom
      name: Bedroom Light
      area: bedroom
      state: "off"
    - entity_id: light.office_desk
      name: Desk Lamp
      area: office
      state: "off"
    - entity_id: switch.coffee_maker
      name: Coffee Maker
      area: kitchen
      state: "off"
    - entity_id: fan.bedroom
      name: Bedroom Fan
      area: bedroom
      state: "off"
    - entity_id: cover.garage_door
      name: Garage Door
      area: garage
      device_class: garage
      state: "open"
    - entity_id: cover.living_room_blinds
      name: Living Room Blinds
      area: living_room
      device_class: blind
      state: "open"
    - entity_id: climate.thermostat
      name: Thermostat
      area: living_room
      state: heat
      attributes:
        current_temperature: 19
        temperature: 20
    - entity_id: media_player.living_room
      name: Living Room Speaker
      area: living_room
      state: playing
    - entity_id: weather.home
      name: Home
      state: sunny
      attributes:
        temperature: 22
    - entity_id: todo.shopping_list
      name: Shopping List
      state: "0"

cases:
  # --- Local: HASSIL covers these today (routing_truth: local) --------------------

  - id: current-time
    utterance: what time is it?
    category: query
    routing_truth: local
    resolves_at_wave0: true
    expected:
      tools:
        - name: HassGetCurrentTime
    expected_llm:
      # Assist drops HassGetCurrentTime; the model uses the general GetDateTime tool.
      tools:
        - name: GetDateTime
    template: "what time is it [[right] now]"
    note: No-slot intent, unambiguous HASSIL match. Answer depends on fixture clock.

  - id: current-date
    utterance: what's the date today?
    category: query
    routing_truth: local
    resolves_at_wave0: true
    expected:
      tools:
        - name: HassGetCurrentDate
    expected_llm:
      tools:
        - name: GetDateTime
    template: "<what_is> the date [today]"
    note: No-slot date intent.

  - id: turn-off-all-lights
    utterance: turn off the lights
    category: device-control
    routing_truth: local
    resolves_at_wave0: true
    requires: [light.kitchen, light.living_room, light.bedroom, light.office_desk]
    # State-scored: the two lit lights must end off (bedroom and office start off).
    # Whatever tool the model uses, the world is judged; asking which light instead of
    # acting leaves them on and fails.
    expect_changes:
      light.kitchen: {state: "off"}
      light.living_room: {state: "off"}
    template: "<turn> (off|out) [<all>] [<the>] {area} <light>"
    note: Bare "the lights" targets all exposed lights.

  - id: turn-on-kitchen-light
    utterance: turn on the kitchen light
    category: device-control
    routing_truth: local
    resolves_at_wave0: true
    requires: [light.kitchen]
    # The fixture light starts on; stage it off so turning it on is a real change.
    setup:
      light.kitchen: {state: "off"}
    expect_changes:
      light.kitchen: {state: "on"}
    template: "[<the>] {area} <light> on"

  - id: turn-off-living-room-lamp
    utterance: turn off the living room lamp
    category: device-control
    routing_truth: local
    resolves_at_wave0: true
    requires: [light.living_room]
    expect_changes:
      light.living_room: {state: "off"}

  - id: set-bedroom-brightness
    utterance: set the bedroom light to 30%
    category: device-control
    routing_truth: local
    resolves_at_wave0: true
    requires: [light.bedroom]
    expected:
      tools:
        - name: HassLightSet
          args: {area: bedroom, brightness: 30}
    # The live model grounds "bedroom light" to the exposed entity by name rather than
    # filling the area slot the local template uses. Both target the same light.
    expected_llm:
      tools:
        - name: HassLightSet
          args: {name: Bedroom Light, brightness: 30}
    template: "[<numeric_value_set>] [<the>] {area} [to] {brightness} percent"

  - id: open-garage-door
    utterance: open the garage door
    category: device-control
    routing_truth: local
    resolves_at_wave0: true
    requires: [cover.garage_door]
    # The fixture garage starts open; stage it closed so opening is a real change.
    setup:
      cover.garage_door: {state: "closed"}
    expect_changes:
      cover.garage_door: {state: "open"}
    template: "<open> [<the>] {cover_classes:device_class} ..."
    note: Opening a cover maps onto HassTurnOn in the intent set.

  - id: close-blinds
    utterance: close the living room blinds
    category: device-control
    routing_truth: local
    resolves_at_wave0: true
    requires: [cover.living_room_blinds]
    # State-scored, so the two equally-valid resolutions (the close intent or driving
    # position to 0) both pass: they land the same state. This is the any_of the tool
    # scorer needed, made unnecessary by judging the world.
    expect_changes:
      cover.living_room_blinds: {state: "closed"}

  - id: set-blinds-position
    utterance: set the living room blinds to 50%
    category: device-control
    routing_truth: local
    resolves_at_wave0: true
    requires: [cover.living_room_blinds]
    # The blind starts fully open (position 100); 50% leaves it open with position 50.
    expect_changes:
      cover.living_room_blinds: {attributes: {current_position: 50}}
    template: "(<numeric_value_set>...) [<the>] {name} [position] to {position} percent"

  - id: room-temperature
    utterance: what's the temperature in the living room?
    category: query
    routing_truth: local
    resolves_at_wave0: true
    requires: [climate.thermostat]
    expected:
      tools:
        - name: HassClimateGetTemperature
          args: {area: living_room}
      answer:
        contains: ["19"]
    expected_llm:
      # Assist drops HassClimateGetTemperature; GetLiveContext reads the live state.
      tools:
        - name: GetLiveContext
      answer:
        contains: ["19"]
    template: "(<what_is>|<how_is>) [the] [current] <temp> <in> [<the>] {area}"

  - id: weather
    utterance: what's the weather?
    category: query
    routing_truth: local
    resolves_at_wave0: true
    requires: [weather.home]
    expected:
      tools:
        - name: HassGetWeather
    expected_llm:
      # Assist drops HassGetWeather; the prompt routes weather to GetLiveContext.
      tools:
        - name: GetLiveContext
    template: "<what_is> [the] weather [like]"

  - id: set-volume
    utterance: set the living room volume to 40%
    category: media
    routing_truth: local
    resolves_at_wave0: true
    requires: [media_player.living_room]
    # The speaker starts at the default volume 0.5; 40% lands 0.4. State-scored, so the
    # area-vs-name grounding that split the tool expectation no longer matters.
    expect_changes:
      media_player.living_room: {attributes: {volume_level: 0.4}}
    template: "<numeric_value_set> [<the>] {area} volume to {volume:volume_level} percent"

  - id: pause-music
    utterance: pause the music
    category: media
    routing_truth: local
    resolves_at_wave0: true
    requires: [media_player.living_room]
    expect_changes:
      media_player.living_room: {state: "paused"}
    template: "pause [[the|my] (music|...)] [in] [<the>] {area}"

  - id: start-timer
    utterance: set a timer for 10 minutes
    category: timer
    routing_truth: local
    resolves_at_wave0: true
    expected:
      tools:
        - name: HassStartTimer
          args: {minutes: 10}
    template: "<timer_set> [a|an|the|my] timer for {timer_minutes:minutes} minute[s]"

  - id: add-shopping-item
    utterance: add milk to the shopping list
    category: list
    routing_truth: local
    resolves_at_wave0: true
    requires: [todo.shopping_list]
    # HassShoppingListAddItem was renamed to HassListAddItem in core; the live run
    # confirmed the current name. This is a global rename, not a scope divergence.
    expected:
      tools:
        - name: HassListAddItem
          args: {item: milk}
    template: "add {shopping_list_item:item} to [my|the] [shopping] list"

  - id: nevermind
    utterance: never mind
    category: small-talk
    routing_truth: local
    resolves_at_wave0: true
    expected:
      tools:
        - name: HassNevermind
    expected_llm:
      # Assist drops HassNevermind; the model just acknowledges in text, no tool. An
      # empty tool list makes correctness unjudgeable (a brief reply is fine either way).
      tools: []
    template: "never mind"
    note: Cancels the interaction; no side effect.

  - id: is-garage-open
    utterance: is the garage door open?
    category: query
    routing_truth: local
    resolves_at_wave0: true
    requires: [cover.garage_door]
    expected:
      tools:
        - name: HassGetState
          args: {name: Garage Door}
      answer:
        contains: ["open"]
    expected_llm:
      # Assist drops HassGetState in favor of GetLiveContext (its docstring says so).
      tools:
        - name: GetLiveContext
      answer:
        contains: ["open"]
    template: "<which> {cover_classes:device_class} <is> {cover_states:state}"
    note: >
      HASSIL covers it, but §2.9 puts GET_STATE in the LLM-defer set; on the LLM path
      it surfaces as GetLiveContext. Baseline runs prefer_local OFF, so it routes to
      the LLM. This case is where the local-vs-LLM split metric earns its keep.

  # --- LLM-only: no HASSIL template, resolves today (routing_truth: llm) -----------

  - id: compound-two-devices
    utterance: turn off the kitchen light and the bedroom fan
    category: compound
    routing_truth: llm
    resolves_at_wave0: true
    requires: [light.kitchen, fan.bedroom]
    # The fan starts off; stage it on so both halves of the conjunction are real changes.
    # State-scored, so "did both" is judged by both devices ending off, independent of
    # whether the model emitted one combined call or two.
    setup:
      fan.bedroom: {state: "on"}
    expect_changes:
      light.kitchen: {state: "off"}
      fan.bedroom: {state: "off"}
    note: >
      Each half is a supported single intent, but the conjunction is not one HASSIL
      template. A clean LLM-only routing case with fully supported actions.

  - id: implicit-cold
    utterance: I'm cold
    category: implicit
    routing_truth: llm
    resolves_at_wave0: true
    requires: [climate.thermostat]
    expected:
      tools:
        - name: HassClimateSetTemperature
          args: {area: living_room}
    note: >
      No template matches; the model infers "raise the thermostat". Expected action is
      loose (a setpoint increase), a candidate for helpfulness judging later.

  - id: implicit-too-dark
    utterance: it's too dark in here
    category: implicit
    routing_truth: llm
    resolves_at_wave0: true
    requires: [light.office_desk]
    expected:
      tools:
        - name: HassTurnOn
          args: {domain: light}
    note: Implicit "turn on / brighten the lights"; no HASSIL template.

  - id: reasoning-did-i-leave-garage
    utterance: did I leave the garage door open?
    category: query
    routing_truth: llm
    resolves_at_wave0: true
    requires: [cover.garage_door]
    expected:
      answer:
        contains: ["open"]
    note: >
      Phrasing outside the HassGetState templates; the model reads state via
      GetLiveContext and answers. Answer-only (no device action).

  - id: knowledge-capital-france
    utterance: what's the capital of France?
    category: knowledge
    routing_truth: llm
    resolves_at_wave0: true
    expected:
      answer:
        contains: ["Paris"]
    note: >
      General knowledge, no tool. The routing measurement shows HASSIL false-matches
      the GetState catch-all and fails with no valid target, so it does not resolve
      locally; the model answers. Exercises the LLM-correct / helpfulness bucket that
      separates an assistant from a command parser.

  # --- Not yet: VISION features unbuilt at Wave 0 (resolves_at_wave0: false) -------
  # These should land in "don't understand" at baseline and move as their wave ships.

  - id: conditional-reminder
    utterance: remind me in an hour if I haven't closed the garage door
    category: knowledge
    routing_truth: llm
    resolves_at_wave0: false
    expected:
      answer:
        contains: ["hour"]
    note: "Scheduling spine (Wave 3). Baseline: don't understand."

  - id: remember-fact
    utterance: remember the wifi password is hunter2-galaxy
    category: knowledge
    routing_truth: llm
    resolves_at_wave0: false
    expected:
      answer:
        contains: ["got it"]
    note: "Notebook memory (Wave 2). Baseline: don't understand."

  - id: undo-last
    utterance: undo that
    category: knowledge
    routing_truth: llm
    resolves_at_wave0: false
    note: "Undo journal (later wave). Baseline: don't understand."
