# Resolver micro-benchmark seed set (docs/find-entities.md, evaluation.md Part G).
#
# Pure data: each case is a query against a named home's candidate phrases (names plus
# area/floor), plus the expected guard outcome. No Home Assistant world, no
# state/exposure - those are async_match_targets' job, not the scorer's. Run it with:
#
#   .venv/bin/python -m evals.harness.resolution
#
# A home is the candidate set the scorer sees, i.e. what async_match_targets already
# returned. That lets a home stand in for a *regime*: a whole small house, or the set
# left after an area filter (every entity shares the area - the TF-IDF sweet spot, where
# the ubiquitous area token should carry little weight). `tags` name the regime so the
# scorecard reports per-regime, which is how a scorer change is judged: a lift in shared-
# word cases must not regress small-home cases. `expect` sets exactly one of:
#   resolves_to: <id>        the guard should decisively pick this entity
#   ambiguous: [<id>, ...]   the guard should return a shortlist containing these
#   none: true               nothing should clear the floor
#
# Cases tagged "shared-word" are semantically unambiguous to a human but a distractor
# shares a common token (like "light" or "living room") and lands inside the guard's
# margin, so the current scorer asks instead of resolving. They are the IDF-weighting
# target: down-weight the shared token and the distractor falls away. They lower decisive
# accuracy without ever becoming false resolves - the guard asks, which is the safe
# failure. "small-home" cases are the counterweight: too few entities to estimate term
# rarity, so IDF must not be trusted there; the corpus-free union scorer keeps them
# decisive, and any IDF change has to leave them that way.
#
# Cases tagged "decoy" and "near-miss" are the caution counterweight, the guardrail on the
# opposite pull. A decoy home puts a confusingly similar sibling beside each target (two
# door locks, a Garage Light next to a Garage Door); a near-miss home names a device that
# does not exist so the nearest match is a decoy to refuse. Making the scorer more decisive
# to win shared-word cases (a lower ACCEPT or margin) is exactly what would turn these
# ask/none outcomes into a confident wrong action, so they must never false-resolve. They
# straddle the thresholds on purpose: the three "* light" near-miss queries land above the
# margin, over the floor but under ACCEPT, and under the floor, pinning where each sits.

homes:
  demo:
    - {entity_id: light.reading, names: [Reading Lamp]}
    - {entity_id: light.kitchen, names: [Kitchen Light]}
    - {entity_id: light.kitchen_ceiling, names: [Ceiling Light Kitchen]}
    - {entity_id: light.bedroom_lamp, names: [Bedroom Lamp]}
    - {entity_id: light.bedroom_ceiling, names: [Bedroom Light]}
    - {entity_id: fan.bedroom, names: [Bedroom Fan]}
    - {entity_id: lock.front, names: [Front Door Lock, Front Door]}
    - {entity_id: cover.living_blind, names: [Living Room Blind]}
    - {entity_id: media_player.living_tv, names: [Living Room TV, TV]}
    - {entity_id: climate.hall, names: [Hallway Thermostat]}
    - {entity_id: switch.xmas, names: [Christmas Tree]}
  studio:
    - {entity_id: light.desk, names: [Desk Lamp]}
    - {entity_id: light.overhead, names: [Overhead Light]}
    - {entity_id: lock.door, names: [Front Door Lock]}

  # Small whole-home: too few entities to estimate term rarity. "light" appears in no
  # name here, so an IDF scorer computing df over just these three would wrongly treat
  # "light" as rare and turn cautious. The corpus-free union scorer must keep the obvious
  # answer decisive; this home is the guardrail that an IDF change cannot regress it.
  cottage:
    - {entity_id: light.reading, names: [Reading Lamp]}
    - {entity_id: switch.fan, names: [Ceiling Fan]}
    - {entity_id: lock.front, names: [Front Door Lock]}

  # Location as the discriminating signal (see find-entities.md area matching). The
  # discriminator "kitchen" lives in the registry, not in these entities' names. The
  # scorer folds area/floor into each candidate's document, so these now resolve while a
  # bare area token still cannot resolve an entity on its own.
  named_by_room:
    - {entity_id: light.kitchen_ceiling, names: [Ceiling Light], area: Kitchen}
    - {entity_id: switch.kitchen_counter, names: [Kitchen Counter], area: Kitchen}
    - {entity_id: light.bedroom_ceiling, names: [Ceiling Light], area: Bedroom}
  same_name_two_rooms:
    - {entity_id: light.kitchen, names: [Light], area: Kitchen}
    - {entity_id: light.living, names: [Light], area: Living Room}

  # Area-filtered candidate set: what async_match_targets returns for area=Kitchen. Every
  # entity carries the "kitchen" token, so it is worthless for discriminating here - the
  # premise of TF-IDF. Several also share "light", so a query for one light must beat the
  # others on the rare token (its own name), not on the shared ones.
  kitchen_area:
    - {entity_id: light.kitchen_ceiling, names: [Ceiling Light], area: Kitchen}
    - {entity_id: light.kitchen_sink, names: [Sink Light], area: Kitchen}
    - {entity_id: switch.kitchen_lights, names: [Kitchen Lights], area: Kitchen}
    - {entity_id: switch.kitchen_kettle, names: [Kettle], area: Kitchen}
    - {entity_id: switch.kitchen_disposal, names: [Garbage Disposal], area: Kitchen}
    - {entity_id: fan.kitchen_hood, names: [Range Hood], area: Kitchen}

  # Medium whole-home: enough entities that df is a stable estimate of term rarity, with
  # several "Ceiling Light" / "*Light" names so "light" is genuinely common. The regime
  # IDF is meant for; also the honesty check that it does not misfire on ordinary queries.
  house:
    - {entity_id: light.lr_ceiling, names: [Living Room Ceiling Light], area: Living Room, floor: Downstairs}
    - {entity_id: light.lr_lamp, names: [Floor Lamp], area: Living Room, floor: Downstairs}
    - {entity_id: media_player.lr_tv, names: [Television], area: Living Room, floor: Downstairs}
    - {entity_id: cover.lr_blinds, names: [Living Room Blinds], area: Living Room, floor: Downstairs}
    - {entity_id: light.kitchen_ceiling, names: [Kitchen Ceiling Light], area: Kitchen, floor: Downstairs}
    - {entity_id: light.kitchen_island, names: [Island Light], area: Kitchen, floor: Downstairs}
    - {entity_id: switch.coffee, names: [Coffee Maker], area: Kitchen, floor: Downstairs}
    - {entity_id: light.hall, names: [Hallway Light], area: Hallway, floor: Downstairs}
    - {entity_id: climate.main, names: [Thermostat], area: Hallway, floor: Downstairs}
    - {entity_id: lock.front, names: [Front Door Lock], area: Entryway, floor: Downstairs}
    - {entity_id: cover.garage, names: [Garage Door], area: Garage, floor: Downstairs}
    - {entity_id: light.primary_ceiling, names: [Ceiling Light], area: Primary Bedroom, floor: Upstairs}
    - {entity_id: light.primary_lamp, names: [Nightstand Lamp], area: Primary Bedroom, floor: Upstairs}
    - {entity_id: fan.primary, names: [Ceiling Fan], area: Primary Bedroom, floor: Upstairs}
    - {entity_id: light.kids_ceiling, names: [Ceiling Light], area: Kids Room, floor: Upstairs}
    - {entity_id: light.bath_vanity, names: [Vanity Light], area: Bathroom, floor: Upstairs}

  # Decoy home: every device has a confusingly similar sibling, so the guard's margin is
  # what stands between a correct resolve and acting on the wrong device. Two door locks
  # (a "back door" request must not touch the front), and a Garage Light beside a Garage
  # Door so "garage door" must not turn on the light (which still scores 71, above ACCEPT)
  # and bare "garage" is honestly ambiguous between a light and a physical door.
  decoys:
    - {entity_id: lock.front, names: [Front Door Lock]}
    - {entity_id: lock.back, names: [Back Door Lock]}
    - {entity_id: light.garage, names: [Garage Light], area: Garage}
    - {entity_id: cover.garage, names: [Garage Door], area: Garage}
    - {entity_id: light.living, names: [Living Room Light], area: Living Room}
    - {entity_id: switch.living_fan, names: [Living Room Fan], area: Living Room}

  # Near-miss home: the named device does not exist, and the nearest candidate is a decoy
  # that shares a token. The safe outcome is to ask or match nothing, never to act on the
  # decoy. The three "* light" queries land in the three score bands the guard divides on:
  # two close decoys (ask), one lone decoy above the floor but under ACCEPT (ask), and one
  # under the floor (none) - so this home pins where FLOOR and ACCEPT actually sit.
  near_miss:
    - {entity_id: light.bath, names: [Bathroom Light], area: Bathroom}
    - {entity_id: cover.bedroom, names: [Bedroom Blind], area: Bedroom}
    - {entity_id: lock.front, names: [Front Door Lock]}
    - {entity_id: climate.hall, names: [Hallway Thermostat], area: Hallway}

cases:
  # --- decisive hits (a clear single winner) ---
  - {id: reading-lamp-exact, home: demo, query: reading lamp, expect: {resolves_to: light.reading}, tags: [decisive]}
  - {id: reading-bare-token, home: demo, query: reading, expect: {resolves_to: light.reading}, tags: [decisive]}
  - {id: thermostat, home: demo, query: thermostat, expect: {resolves_to: climate.hall}, tags: [decisive]}
  - {id: christmas-tree, home: demo, query: the christmas tree, expect: {resolves_to: switch.xmas}, tags: [decisive],
     note: "leading filler 'the' must not sink the match"}
  - {id: front-door-alias, home: demo, query: front door, expect: {resolves_to: lock.front}, tags: [decisive]}
  - {id: tv-alias, home: demo, query: tv, expect: {resolves_to: media_player.living_tv}, tags: [decisive]}
  - {id: kitchen-ceiling-order, home: demo, query: kitchen ceiling, expect: {resolves_to: light.kitchen_ceiling},
     tags: [decisive], note: "'ceiling' is unique to the ceiling light, so word order aside it wins"}

  # --- small-home: too few entities for IDF; union must keep these decisive ---
  - {id: desk-lamp-studio, home: studio, query: desk lamp, expect: {resolves_to: light.desk}, tags: [small-home, decisive]}
  - {id: cottage-reading-light, home: cottage, query: reading light, expect: {resolves_to: light.reading},
     tags: [small-home], note: "'light' absent from this 3-entity home; union resolves via 'reading', IDF would over-penalize"}
  - {id: cottage-front-door, home: cottage, query: front door, expect: {resolves_to: lock.front}, tags: [small-home]}

  # --- shared-word: a common token dilutes the discriminator (IDF target) ---
  - {id: reading-light, home: demo, query: reading light, expect: {resolves_to: light.reading},
     tags: [shared-word], note: "'light' shared with Kitchen Light, which lands in the margin"}
  - {id: living-room-blind, home: demo, query: living room blind, expect: {resolves_to: cover.living_blind},
     tags: [shared-word], note: "'living room' shared with the TV (88) sits inside the margin of the target (100)"}
  - {id: house-living-blinds, home: house, query: living room blinds, expect: {resolves_to: cover.lr_blinds},
     tags: [shared-word, medium-home], note: "same collision with more entities: does stable df separate blinds from TV"}
  - {id: kitchen-sink-light, home: kitchen_area, query: kitchen sink light, expect: {resolves_to: light.kitchen_sink},
     tags: [shared-word, area-filtered], note: "Ceiling Light shares kitchen+light; only 'sink' separates them"}
  - {id: kitchen-ceiling-light, home: kitchen_area, query: kitchen ceiling light, expect: {resolves_to: light.kitchen_ceiling},
     tags: [shared-word, area-filtered], note: "Sink Light and Kitchen Lights both share kitchen+light"}

  # --- area-filtered: the ubiquitous area token must not decide; a rare name does ---
  - {id: kitchen-disposal, home: kitchen_area, query: garbage disposal, expect: {resolves_to: switch.kitchen_disposal},
     tags: [area-filtered, decisive]}
  - {id: kitchen-kettle, home: kitchen_area, query: kettle, expect: {resolves_to: switch.kitchen_kettle},
     tags: [area-filtered, decisive]}

  # --- medium-home: stable df; ordinary queries and location disambiguation ---
  - {id: house-thermostat, home: house, query: thermostat, expect: {resolves_to: climate.main}, tags: [medium-home, decisive]}
  - {id: house-coffee, home: house, query: coffee maker, expect: {resolves_to: switch.coffee}, tags: [medium-home, decisive]}
  - {id: house-garage, home: house, query: garage door, expect: {resolves_to: cover.garage}, tags: [medium-home, decisive]}
  - {id: house-nightstand, home: house, query: nightstand lamp, expect: {resolves_to: light.primary_lamp}, tags: [medium-home]}
  - {id: house-island-light, home: house, query: island light, expect: {resolves_to: light.kitchen_island},
     tags: [medium-home, shared-word], note: "'light' common across the home; 'island' is the discriminator"}
  - {id: house-primary-ceiling, home: house, query: primary bedroom ceiling light, expect: {resolves_to: light.primary_ceiling},
     tags: [medium-home, location], note: "three 'Ceiling Light' entities; the area 'Primary Bedroom' picks one"}

  # --- location: the discriminating token is the area, not the name ---
  - {id: room-completes-name, home: named_by_room, query: kitchen light, expect: {resolves_to: light.kitchen_ceiling},
     tags: [location], note: "'Ceiling Light' in the Kitchen; area completes the name, union keeps the Kitchen Counter switch below the margin"}
  - {id: room-disambiguates, home: same_name_two_rooms, query: kitchen light, expect: {resolves_to: light.kitchen},
     tags: [location], note: "two entities named 'Light'; the area picks the kitchen one"}

  # --- genuinely ambiguous (the guard should ask) ---
  - {id: bedroom-family, home: demo, query: bedroom,
     expect: {ambiguous: [light.bedroom_lamp, light.bedroom_ceiling, fan.bedroom]},
     tags: [ambiguous], note: "three bedroom devices tie; ask which"}
  - {id: no-room-stays-ambiguous, home: same_name_two_rooms, query: light,
     expect: {ambiguous: [light.kitchen, light.living]},
     tags: [ambiguous, location], note: "no room in the query, so the two Lights are genuinely ambiguous and must stay so"}
  - {id: kitchen-two-lights, home: kitchen_area, query: light,
     expect: {ambiguous: [light.kitchen_ceiling, light.kitchen_sink]},
     tags: [ambiguous, area-filtered],
     note: "bare 'light' in the kitchen is ambiguous; the Kitchen Lights switch misses on the singular/plural token (a stemming gap, not an IDF one)"}

  # --- nothing should match ---
  - {id: nonsense, home: demo, query: xylophone, expect: {none: true}, tags: [none]}
  - {id: absent-domain, home: studio, query: garage door, expect: {none: true},
     tags: [none, small-home], note: "no garage entity in the studio home"}

  # --- decoy: a confusingly similar sibling is present; the margin must not misfire ---
  # The action-caution regime. A decisive resolve here is only safe because the target
  # beats its decoy by more than the margin; where two decoys tie, or a bare token fits
  # both, the guard must ask rather than guess. These must never false-resolve.
  - {id: decoy-back-door, home: decoys, query: back door, expect: {resolves_to: lock.back},
     tags: [decoy, decisive], note: "Front Door Lock decoy at 62 loses to Back Door Lock at 100"}
  - {id: decoy-garage-door-not-light, home: decoys, query: garage door, expect: {resolves_to: cover.garage},
     tags: [decoy, decisive], note: "Garage Light scores 71 (over ACCEPT) but the margin keeps the door the winner"}
  - {id: decoy-garage-light-not-door, home: decoys, query: garage light, expect: {resolves_to: light.garage},
     tags: [decoy, decisive], note: "the mirror: 'light' picks the light, not the equally garage-tokened door"}
  - {id: decoy-two-locks, home: decoys, query: door lock,
     expect: {ambiguous: [lock.front, lock.back]},
     tags: [decoy, ambiguous], note: "both locks tie at 100; a security action must ask, never guess a door"}
  - {id: decoy-bare-garage, home: decoys, query: garage,
     expect: {ambiguous: [light.garage, cover.garage]},
     tags: [decoy, ambiguous], note: "bare shared token fits a light and a door equally; ask which"}

  # --- near-miss: the named device is absent; the nearest match is a decoy to refuse ---
  # These pin the two thresholds. A too-eager scorer (lower ACCEPT or margin) would turn
  # the ask/none outcomes here into a confident wrong action, so they are the guardrail on
  # the caution side of tuning.
  - {id: near-miss-two-decoys, home: near_miss, query: bedroom light,
     expect: {ambiguous: [light.bath, cover.bedroom]},
     tags: [near-miss, ambiguous],
     note: "no bedroom light exists; Bathroom Light (81) and Bedroom Blind (77) sit within the margin, so ask"}
  - {id: near-miss-below-accept, home: near_miss, query: basement light,
     expect: {ambiguous: [light.bath]},
     tags: [near-miss, ambiguous],
     note: "lone decoy Bathroom Light at 64 is over the floor but under ACCEPT: shortlist, don't act"}
  - {id: near-miss-below-floor, home: near_miss, query: kitchen light, expect: {none: true},
     tags: [near-miss, none], note: "nearest is Bathroom Light at 59, under the floor: nothing clears"}
  - {id: near-miss-wrong-door, home: near_miss, query: back door,
     expect: {ambiguous: [lock.front]},
     tags: [near-miss, ambiguous],
     note: "only a Front Door Lock exists; a 'back door' request must not decisively unlock the front"}
