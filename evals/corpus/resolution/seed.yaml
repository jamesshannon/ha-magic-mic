# Resolver micro-benchmark seed set (docs/find-entities.md, evaluation.md Part G).
#
# Pure data: each case is a query against a named home's candidate phrases (names plus
# area/floor), plus the expected guard outcome. No Home Assistant world, no
# state/exposure - those are async_match_targets' job, not the scorer's. Run it with:
#
#   .venv/bin/python -m evals.harness.resolution
#
# Homes are candidate universes (and the document corpus a future IDF-weighted scorer
# would learn term weights from). `expect` sets exactly one of:
#   resolves_to: <id>        the guard should decisively pick this entity
#   ambiguous: [<id>, ...]   the guard should return a shortlist containing these
#   none: true               nothing should clear the floor
#
# Cases tagged "headroom" below are semantically unambiguous to a human but the current
# scorer does not resolve them yet: a shared category word (like "light") dilutes the
# discriminating token, so a wrong candidate stays within the guard's margin. They are
# the tuning target for IDF weighting, and they lower decisive-accuracy without ever
# becoming false resolves - the guard asks instead of guessing wrong, the safe failure.
# (Location cases below, where the discriminator is the area, now resolve: the scorer
# reads area/floor as part of the document.)

homes:
  demo:
    - {entity_id: light.reading, names: [Reading Lamp]}
    - {entity_id: light.kitchen, names: [Kitchen Light]}
    - {entity_id: light.kitchen_ceiling, names: [Ceiling Light Kitchen]}
    - {entity_id: light.bedroom_lamp, names: [Bedroom Lamp]}
    - {entity_id: light.bedroom_ceiling, names: [Bedroom Light]}
    - {entity_id: fan.bedroom, names: [Bedroom Fan]}
    - {entity_id: lock.front, names: [Front Door Lock, Front Door]}
    - {entity_id: cover.living_blind, names: [Living Room Blind]}
    - {entity_id: media_player.living_tv, names: [Living Room TV, TV]}
    - {entity_id: climate.hall, names: [Hallway Thermostat]}
    - {entity_id: switch.xmas, names: [Christmas Tree]}
  studio:
    - {entity_id: light.desk, names: [Desk Lamp]}
    - {entity_id: light.overhead, names: [Overhead Light]}
    - {entity_id: lock.door, names: [Front Door Lock]}

  # Location as the discriminating signal (see find-entities.md area matching). The
  # discriminator "kitchen" lives in the registry, not in these entities' names. The
  # scorer folds area/floor into each candidate's document, so these now resolve while a
  # bare area token still cannot resolve an entity on its own.
  named_by_room:
    - {entity_id: light.kitchen_ceiling, names: [Ceiling Light], area: Kitchen}
    - {entity_id: switch.kitchen_counter, names: [Kitchen Counter], area: Kitchen}
    - {entity_id: light.bedroom_ceiling, names: [Ceiling Light], area: Bedroom}
  same_name_two_rooms:
    - {entity_id: light.kitchen, names: [Light], area: Kitchen}
    - {entity_id: light.living, names: [Light], area: Living Room}

cases:
  # --- decisive hits (a clear single winner) ---
  - {id: reading-lamp-exact, home: demo, query: reading lamp, expect: {resolves_to: light.reading}}
  - {id: reading-bare-token, home: demo, query: reading, expect: {resolves_to: light.reading}}
  - {id: thermostat, home: demo, query: thermostat, expect: {resolves_to: climate.hall}}
  - {id: christmas-tree, home: demo, query: the christmas tree, expect: {resolves_to: switch.xmas}}
  - {id: front-door-alias, home: demo, query: front door, expect: {resolves_to: lock.front}}
  - {id: tv-alias, home: demo, query: tv, expect: {resolves_to: media_player.living_tv}}
  - {id: desk-lamp-studio, home: studio, query: desk lamp, expect: {resolves_to: light.desk}}

  # --- headroom: should resolve, still diluted by a shared category word (IDF target) ---
  - {id: reading-light, home: demo, query: reading light, expect: {resolves_to: light.reading},
     note: "headroom - 'light' dilutes 'reading'; Kitchen Light collides"}
  - {id: living-room-blind, home: demo, query: living room blind, expect: {resolves_to: cover.living_blind},
     note: "headroom - 'living room' shared with the TV dilutes 'blind'"}

  # --- resolves: the discriminating token is present and unshared ---
  - {id: kitchen-ceiling-order, home: demo, query: kitchen ceiling, expect: {resolves_to: light.kitchen_ceiling},
     note: "'ceiling' is unique to the ceiling light, so word order aside it wins"}

  # --- genuinely ambiguous (the guard should ask) ---
  - {id: bedroom-family, home: demo, query: bedroom,
     expect: {ambiguous: [light.bedroom_lamp, light.bedroom_ceiling, fan.bedroom]},
     note: "three bedroom devices tie; ask which"}

  # --- location: the discriminating token is the area, not the name (now resolves) ---
  - {id: room-completes-name, home: named_by_room, query: kitchen light, expect: {resolves_to: light.kitchen_ceiling},
     note: "'Ceiling Light' in the Kitchen; area completes the name, and the union keeps the Kitchen Counter switch below the margin"}
  - {id: room-disambiguates, home: same_name_two_rooms, query: kitchen light, expect: {resolves_to: light.kitchen},
     note: "two entities named 'Light'; the area picks the kitchen one"}
  - {id: no-room-stays-ambiguous, home: same_name_two_rooms, query: light,
     expect: {ambiguous: [light.kitchen, light.living]},
     note: "control - with no room in the query the two Lights are genuinely ambiguous, and must stay so"}

  # --- nothing should match ---
  - {id: nonsense, home: demo, query: xylophone, expect: {none: true}}
  - {id: absent-domain, home: studio, query: garage door, expect: {none: true},
     note: "no garage entity in the studio home"}
