# Wave 1 fuzzy-fallback corpus (find_entities Consumer 1).
#
# Exercises the match-layer fuzzy fallback (docs/find-entities.md Consumer 1): the model
# names a device the way a person speaks, the exact name match misses, and the shared
# resolver recovers the canonical entity before the error reaches the model. See
# ../README.md for the field spec.
#
# Every entity's registered name is more formal than the natural phrasing a case uses
# ("Corner Floor Lamp" vs "the floor lamp"), so the exact NAME match fails by construction.
# The run drives the testbed agent with the entity summary ON and name injection OFF
# (evals/harness/fuzzy_fallback.py), so the model never sees the exact roster: to act it must
# either call find_entities (Consumer 2) or emit an approximate name that Consumer 1
# resolves.
#
# Two placement facts the first live run taught (see docs/find-entities.md "Consumer 1
# live"):
#   - The model scopes a name-bearing call to its satellite's room ("the user is in the
#     living room"), and the fallback honors that scope. So the satellite sits in a neutral
#     room (hallway, no devices) and the decisive cases name their room, matching how the
#     resolution is scoped in practice.
#   - A bare name that matches two devices in different rooms is genuinely ambiguous; the
#     correct outcome is to ask, not to guess (the ambiguous-lamp case).
#
# Cases are state-scored, so a wrong-target resolution actuates the wrong device and fails;
# the runner also reports which resolution path each case took.

world:
  areas:
    - bedroom
    - den
    - hallway
    - kitchen
    - living_room
    - office
  entities:
    # Two lamps in different rooms: named with their room each resolves decisively; a bare
    # "the lamp" from a neutral room is ambiguous across the two.
    - entity_id: light.den_floor
      name: Corner Floor Lamp
      area: den
      state: "off"
    - entity_id: light.bedroom_bedside
      name: Bedside Table Lamp
      area: bedroom
      state: "off"
    - entity_id: light.living_couch
      name: Sofa Reading Light
      area: living_room
      state: "off"
    # "under cabinet lights" vs "Under Cabinet Lighting": one fuzzy token ("lights" vs
    # "lighting") drops this into the diluted regime, near the accept threshold. Whether it
    # resolves directly, falls to find_entities, or comes back not-found is the signal.
    - entity_id: light.kitchen_strip
      name: Under Cabinet Lighting
      area: kitchen
      state: "off"
    - entity_id: cover.office_shade
      name: Office Roller Shade
      area: office
      device_class: shade
      state: "open"

cases:
  - id: fuzzy-floor-lamp
    utterance: turn on the floor lamp in the den
    category: device-control
    routing_truth: llm
    resolves_at_wave0: true
    requires: [light.den_floor]
    # "floor lamp" is a subset of "Corner Floor Lamp" and the den's only light, so the
    # resolver must land it.
    expect_changes:
      light.den_floor: {state: "on"}
    permitted_tools:
      - name: GetLiveContext
      - name: HassTurnOn
      - name: find_entities

  - id: fuzzy-reading-light
    utterance: turn on the reading light in the living room
    category: device-control
    routing_truth: llm
    resolves_at_wave0: true
    requires: [light.living_couch]
    expect_changes:
      light.living_couch: {state: "on"}
    permitted_tools:
      - name: GetLiveContext
      - name: HassTurnOn
      - name: find_entities

  - id: fuzzy-bedside-lamp
    utterance: turn on the bedside lamp in the bedroom
    category: device-control
    routing_truth: llm
    resolves_at_wave0: true
    requires: [light.bedroom_bedside]
    expect_changes:
      light.bedroom_bedside: {state: "on"}
    permitted_tools:
      - name: GetLiveContext
      - name: HassTurnOn
      - name: find_entities

  - id: fuzzy-office-shade
    utterance: close the roller shade in the office
    category: device-control
    routing_truth: llm
    resolves_at_wave0: true
    requires: [cover.office_shade]
    expect_changes:
      cover.office_shade: {state: "closed"}
    permitted_tools:
      - name: GetLiveContext
      - name: HassSetPosition
      - name: HassTurnOff
      - name: find_entities

  - id: fuzzy-under-cabinet
    utterance: turn on the under cabinet lights in the kitchen
    category: device-control
    routing_truth: llm
    resolves_at_wave0: true
    requires: [light.kitchen_strip]
    # Near-threshold: the single fuzzy token may or may not clear the accept score. A
    # correct resolution (directly or via find_entities) passes; a not-found reply that
    # leaves the light off fails, surfacing where the threshold sits on a real utterance.
    expect_changes:
      light.kitchen_strip: {state: "on"}
    permitted_tools:
      - name: GetLiveContext
      - name: HassTurnOn
      - name: find_entities

  - id: ambiguous-lamp
    utterance: turn on the lamp
    category: device-control
    routing_truth: llm
    resolves_at_wave0: true
    requires: [light.den_floor, light.bedroom_bedside]
    # From the hallway (no light of its own), a bare "the lamp" matches two lamps in two
    # rooms and neither is decisive. The correct outcome is to ask, not to guess. Scored by
    # both lamps staying off: any actuation is a wrong-target guess and fails.
    expect_changes:
      light.den_floor: {state: "off"}
      light.bedroom_bedside: {state: "off"}
    permitted_tools:
      - name: GetLiveContext
      - name: HassTurnOn
      - name: find_entities
