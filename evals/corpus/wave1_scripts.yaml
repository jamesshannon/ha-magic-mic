# Wave 1 script-heavy home.
#
# A fixture for capability selection (docs/capability-selection.md), not for the live
# golden-set runner. Home Assistant exposes each script to Assist as its own LLM tool
# named by object id (script.movie_night -> the tool `movie_night`), so a home with many
# routines pushes the exposed roster well past any sane per-turn tool budget. That is the
# case the tool budget actually has to choose within, and the one the small, clean Wave 0
# set cannot show.
#
# The shadow harness reads this corpus directly (`selection_shadow --corpus`): it builds a
# per-script descriptor for each script entity from the script's configured metadata, then
# scores whether selection would have exposed the tool each case declares (`expected`),
# across a budget sweep. It needs no live model, because the ground-truth tool is the one
# the case names. `expected` tool names are the script object ids.
#
# Measurement honesty. The aliases below are authored from each script's *purpose*, the way
# a cooperative household writes voice triggers, not from the test utterances. Cases are
# tagged by correlation regime so the aggregate cannot hide a weak result:
#   - `in_vocabulary`  the configuring user's own words; overlap with name/alias is real and
#                      legitimate, so recall here should be high.
#   - `out_of_vocabulary`  a different speaker, a guest, or drift, phrased without regard to
#                      the configured triggers. Some are caught because good aliases
#                      generalize; the misses are the honest residual gap.
# The number that should gate enforcement is out-of-vocabulary recall, not the aggregate.

world:
  areas:
    - kitchen
    - living_room
    - dining_room
    - bedroom
    - bathroom
    - office
    - garage
    - entryway
  entities:
    # Ordinary devices, so the base control bundles are present and a plain command still
    # has to compete with the scripts for budget.
    - entity_id: light.living_room
      name: Living Room Lamp
      area: living_room
      state: "on"
    - entity_id: light.kitchen
      name: Kitchen Light
      area: kitchen
      state: "off"
    - entity_id: cover.garage_door
      name: Garage Door
      area: garage
      device_class: garage
      state: closed
    - entity_id: media_player.living_room
      name: Living Room Speaker
      area: living_room
      state: idle

    # Configured routines: aliases and a description a thorough household would set, written
    # from the script's function (not from any test utterance).
    - entity_id: script.movie_night
      name: Movie Night
      area: living_room
      aliases:
        - movie time
        - film night
        - watch a film
      description: Dim the lights and start the projector for a film.
    - entity_id: script.good_morning
      name: Good Morning
      area: bedroom
      aliases:
        - start the day
        - morning routine
      description: Raise the lights and open the blinds to start the day.
    - entity_id: script.good_night
      name: Good Night
      area: bedroom
      aliases:
        - night night
      description: Shut the house down for the night.
    - entity_id: script.bedtime
      name: Bedtime
      area: bedroom
      aliases:
        - going to bed
        - time for bed
      description: Wind down for the night, turning the lights off and locking the doors.
    - entity_id: script.leaving_home
      name: Leaving Home
      area: entryway
      aliases:
        - I'm leaving
        - leaving the house
        - goodbye
      description: Away mode, turning everything off and locking the doors.
    - entity_id: script.arriving_home
      name: Arriving Home
      area: entryway
      aliases:
        - I'm home
        - we're back
      description: Welcome home, turning the lights on and unlocking the doors.
    - entity_id: script.reading_mode
      name: Reading Mode
      area: living_room
      aliases:
        - reading time
        - book time
      description: Warm, focused light for reading a book.
    - entity_id: script.party_mode
      name: Party Mode
      area: living_room
      aliases:
        - party time
        - let's party
      description: Colorful lights and music for a party.
    - entity_id: script.romantic_dinner
      name: Romantic Dinner
      area: dining_room
      aliases:
        - date night
        - dinner for two
      description: Low warm lights and soft music for dinner.
    - entity_id: script.focus_mode
      name: Focus Mode
      area: office
      aliases:
        - work mode
        - deep work
      description: Bright, neutral light and no distractions for working.
    - entity_id: script.night_security
      name: Night Security
      area: garage
      aliases:
        - arm the alarm
        - lock up for the night
      description: Arm the alarm and lock the doors overnight.
    - entity_id: script.coffee_time
      name: Coffee Time
      area: kitchen
      aliases:
        - make coffee
        - brew coffee
      description: Start the coffee maker.
    - entity_id: script.workout
      name: Workout
      area: office
      aliases:
        - exercise time
        - gym mode
      description: Upbeat music and bright light for exercising.
    - entity_id: script.water_plants
      name: Water the Plants
      area: living_room
      aliases:
        - watering time
      description: Run the plant watering routine.

    # Routines a household never got around to configuring: name only, no triggers.
    - entity_id: script.game_night
      name: Game Night
      area: living_room
    - entity_id: script.relax
      name: Relax
      area: living_room
    - entity_id: script.wake_up
      name: Wake Up
      area: bedroom
    - entity_id: script.guest_mode
      name: Guest Mode
      area: entryway
    - entity_id: script.dinner_party
      name: Dinner Party
      area: dining_room
    - entity_id: script.cooking_mode
      name: Cooking Mode
      area: kitchen
    - entity_id: script.bath_time
      name: Bath Time
      area: bathroom
    - entity_id: script.shower_warmup
      name: Shower Warmup
      area: bathroom
    - entity_id: script.feed_fish
      name: Feed the Fish
      area: living_room
    - entity_id: script.vacuum_downstairs
      name: Vacuum Downstairs
      area: living_room
    - entity_id: script.morning_news
      name: Morning News
      area: kitchen
    - entity_id: script.sunset_lights
      name: Sunset Lights
      area: living_room

cases:
  # In-vocabulary: the configuring user, using the name or a trigger they set. Overlap is
  # legitimate; recall here should be high.
  - id: iv-movie-night
    utterance: start movie night
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: movie_night
  - id: iv-coffee
    utterance: make coffee
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: coffee_time
  - id: iv-party
    utterance: party time
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: party_mode
  - id: iv-focus
    utterance: switch to work mode
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: focus_mode
  - id: iv-bedtime
    utterance: time for bed
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: bedtime
  - id: iv-security
    utterance: arm the alarm
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: night_security
  - id: iv-romantic
    utterance: set up date night
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: romantic_dinner
  - id: iv-workout
    utterance: gym mode
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: workout
  - id: iv-goodnight
    utterance: night night
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: good_night
  - id: iv-goodmorning
    utterance: morning routine
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: good_morning
  - id: iv-reading
    utterance: book time
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: reading_mode
  - id: iv-water
    utterance: watering time
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: water_plants
  - id: iv-leaving
    utterance: leaving the house
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: leaving_home
  - id: iv-arriving
    utterance: I'm home
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: in_vocabulary
    expected:
      tools:
        - name: arriving_home

  # Out-of-vocabulary: a different speaker's natural phrasing, written without regard to the
  # configured triggers. Some land because good aliases generalize; the misses are real.
  # Both alias-configured and name-only scripts are represented, so the number is not the
  # optimistic one an all-configured set produces: an oblique request for a script whose owner
  # only named it (no alias, no description) is largely unretrievable, and that residual is
  # exactly the cost enforcement pays and the gate must see.
  - id: oob-bedtime
    utterance: I'm going to sleep
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: bedtime
  - id: oob-leaving
    utterance: I'm taking off now
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: leaving_home
  - id: oob-reading
    utterance: I feel like curling up with a book
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: reading_mode
  - id: oob-focus
    utterance: help me concentrate
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: focus_mode
  - id: oob-morning
    utterance: let's get the day started
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: good_morning
  - id: oob-arriving
    utterance: we just got back
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: arriving_home
  - id: oob-guest-movie
    utterance: can we watch something tonight
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: movie_night
  - id: oob-party
    utterance: let's have some fun in here
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: party_mode
  # Alias-configured scripts, oblique phrasing: a description or alias token may still bridge.
  - id: oob-water
    utterance: the plants are looking dry
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: water_plants
  - id: oob-coffee
    utterance: I could really use some caffeine
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: coffee_time
  - id: oob-security
    utterance: keep the house secure overnight
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: night_security
  - id: oob-romantic
    utterance: cozy dinner for just the two of us
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: romantic_dinner
  - id: oob-workout
    utterance: I'm about to hit the treadmill
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: workout
  # Name-only scripts, oblique phrasing: no alias or description to bridge, so most are honest
  # misses that quantify the cost of enforcing a budget on an unconfigured routine.
  - id: oob-relax
    utterance: help me unwind for a while
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: relax
  - id: oob-news
    utterance: catch me up on the headlines
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: morning_news
  - id: oob-fish
    utterance: the aquarium needs looking after
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: feed_fish
  - id: oob-vacuum
    utterance: the floors down here need cleaning
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: vacuum_downstairs
  - id: oob-sunset
    utterance: it's getting dark, set the evening scene
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: sunset_lights
  - id: oob-bath
    utterance: I'd like to take a long soak
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    phrasing: out_of_vocabulary
    expected:
      tools:
        - name: bath_time

  # Plain device control and a read must still survive a roster crowded with scripts.
  - id: base-turn-on-light
    utterance: turn on the kitchen light
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    expected:
      tools:
        - name: HassTurnOn
  - id: base-open-garage
    utterance: open the garage door
    category: action
    routing_truth: llm
    resolves_at_wave0: true
    expected:
      tools:
        - name: HassSetPosition
  - id: base-read-time
    utterance: what time is it
    category: query
    routing_truth: llm
    resolves_at_wave0: true
    expected:
      tools:
        - name: GetDateTime
