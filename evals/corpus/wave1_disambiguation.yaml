# Wave 1 disambiguation trajectories.
#
# A corpus for the multi-turn driver (evals/harness/trajectory.py), not the single-turn
# golden-set runner. Each case declares a world, an ordered set of user turns, and the
# provider's scripted generations per turn, plus the expected end state. The same cases
# run two ways: scripted through the driver (evals/harness/trajectory.py, keyless, in the
# test suite) and live through a real model (evals/harness/trajectory_live.py, needs a key).
#
# Authored for genuine live ambiguity. An earlier version was written only for the scripted
# driver, and the first live run exposed the difference: a case named one light exactly
# "Bedroom Light", so "turn on the bedroom light" was an exact match a live model rightly
# acted on rather than an ambiguity, and an oblique case ("I want to read") had no follow-up
# turn and a strict end state, so a model that reasonably set a reading scene could not pass.
# This version keeps only genuine disambiguation: for every ambiguous case no entity's name
# is an exact match for the request (only a shared token like "lamp" is), so a live model
# has to disambiguate to be correct, and every recovered case has a follow-up turn that
# answers the clarifying question, so a model that asks can finish.
#
# What it measures. Scoring is world-based (score_trajectory over the states each turn left
# behind), so a case scores the same whether the generations are scripted or a live model's.
# A `recovered: true` case passes only if the world does not reach its goal on the first turn
# and does reach it on a later turn in the same conversation: scripted, that exercises the
# ambiguous-result-to-question-to-follow-up machinery (history replay, session state, tool
# policy); live, it means the model actually asked before acting instead of guessing. A model
# that guesses right on the first turn scores DIRECT and fails a recovered case, which is the
# emergent finding the script cannot show. `recovered: false` cases are direct commands that
# must complete on the first turn.
#
# Each generation is one provider round: `{tool: <name>, args: {...}}` calls a tool,
# `{say: <text>}` speaks and ends the round. A turn that ends in `say` ends as speech; a
# clarifying question is just a `say` whose text asks. `action_tool` is the tool whose
# firing completes the task, and `final_state` is the end state each entity must hold.

cases:
  - id: ambiguous-two-bedroom-lamps
    tags: [disambiguation, two-way]
    action_tool: HassTurnOn
    world:
      areas: [bedroom]
      entities:
        - {entity_id: light.bedside_lamp, name: Bedside Lamp, area: bedroom, state: "off"}
        - {entity_id: light.dresser_lamp, name: Dresser Lamp, area: bedroom, state: "off"}
    expect:
      recovered: true
      final_state: {light.bedside_lamp: "on", light.dresser_lamp: "off"}
    turns:
      - utterance: turn on the lamp
        generations:
          - {tool: find_entities, args: {name: lamp}}
          - {say: "There are two: the Bedside Lamp or the Dresser Lamp?"}
      - utterance: the bedside one
        generations:
          - {tool: HassTurnOn, args: {name: Bedside Lamp}}
          - {say: "Turned on the Bedside Lamp."}

  - id: ambiguous-three-living-room-lamps
    tags: [disambiguation, three-way]
    action_tool: HassTurnOn
    world:
      areas: [living_room]
      entities:
        - {entity_id: light.left_lamp, name: Left Lamp, area: living_room, state: "off"}
        - {entity_id: light.right_lamp, name: Right Lamp, area: living_room, state: "off"}
        - {entity_id: light.corner_lamp, name: Corner Lamp, area: living_room, state: "off"}
    expect:
      recovered: true
      final_state:
        light.corner_lamp: "on"
        light.left_lamp: "off"
        light.right_lamp: "off"
    turns:
      - utterance: turn on the lamp
        generations:
          - {tool: find_entities, args: {name: lamp}}
          - {say: "There are three: the Left Lamp, the Right Lamp, or the Corner Lamp?"}
      - utterance: the corner one
        generations:
          - {tool: HassTurnOn, args: {name: Corner Lamp}}
          - {say: "Turned on the Corner Lamp."}

  - id: ambiguous-two-bedroom-fans
    tags: [disambiguation, two-way, fan]
    action_tool: HassTurnOn
    world:
      areas: [bedroom]
      entities:
        - {entity_id: fan.ceiling_fan, name: Ceiling Fan, area: bedroom, state: "off"}
        - {entity_id: fan.tower_fan, name: Tower Fan, area: bedroom, state: "off"}
    expect:
      recovered: true
      final_state: {fan.tower_fan: "on", fan.ceiling_fan: "off"}
    turns:
      - utterance: turn on the fan
        generations:
          - {tool: find_entities, args: {name: fan}}
          - {say: "The Ceiling Fan or the Tower Fan?"}
      - utterance: the tower one
        generations:
          - {tool: HassTurnOn, args: {name: Tower Fan}}
          - {say: "Turned on the Tower Fan."}

  - id: ambiguous-two-living-room-blinds
    # Covers open/close through HassTurnOn/HassTurnOff, not HassOpenCover: HA marks the
    # dedicated cover intents deprecated and drops them from the LLM roster (they are in
    # AssistAPI.IGNORE_INTENTS), routing "open the blind" through the on/off handler, which
    # special-cases the cover domain. action_tool is HassTurnOn for that reason.
    tags: [disambiguation, two-way, cover]
    action_tool: HassTurnOn
    world:
      areas: [living_room]
      entities:
        - {entity_id: cover.left_blind, name: Left Blind, area: living_room, device_class: blind, state: "closed"}
        - {entity_id: cover.right_blind, name: Right Blind, area: living_room, device_class: blind, state: "closed"}
    expect:
      recovered: true
      final_state: {cover.left_blind: "open", cover.right_blind: "closed"}
    turns:
      - utterance: open the blind
        generations:
          - {tool: find_entities, args: {name: blind}}
          - {say: "The Left Blind or the Right Blind?"}
      - utterance: the left one
        generations:
          - {tool: HassTurnOn, args: {name: Left Blind}}
          - {say: "Opened the Left Blind."}

  - id: ambiguous-reading-lamp-two-rooms
    tags: [disambiguation, two-way, area]
    action_tool: HassTurnOn
    world:
      areas: [bedroom, office]
      entities:
        - {entity_id: light.bedroom_reading, name: Reading Lamp, area: bedroom, state: "off"}
        - {entity_id: light.office_reading, name: Reading Lamp, area: office, state: "off"}
    expect:
      recovered: true
      final_state: {light.office_reading: "on", light.bedroom_reading: "off"}
    turns:
      - utterance: turn on the reading lamp
        generations:
          - {tool: find_entities, args: {name: reading lamp}}
          - {say: "There is one in the bedroom and one in the office. Which room?"}
      - utterance: the office one
        generations:
          - {tool: HassTurnOn, args: {name: Reading Lamp, area: office}}
          - {say: "Turned on the office Reading Lamp."}

  - id: direct-kitchen-light
    tags: [direct]
    action_tool: HassTurnOn
    world:
      areas: [kitchen]
      entities:
        - {entity_id: light.kitchen, name: Kitchen Light, area: kitchen, state: "off"}
    expect:
      recovered: false
      final_state: {light.kitchen: "on"}
    turns:
      - utterance: turn on the kitchen light
        generations:
          - {tool: HassTurnOn, args: {name: Kitchen Light}}
          - {say: "Turned on the Kitchen Light."}

  - id: direct-coffee-maker
    tags: [direct, switch]
    action_tool: HassTurnOn
    world:
      areas: [kitchen]
      entities:
        - {entity_id: switch.coffee_maker, name: Coffee Maker, area: kitchen, state: "off"}
    expect:
      recovered: false
      final_state: {switch.coffee_maker: "on"}
    turns:
      - utterance: turn on the coffee maker
        generations:
          - {tool: HassTurnOn, args: {name: Coffee Maker}}
          - {say: "Turned on the Coffee Maker."}
